<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>404 — meatbag</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#040705;color:#39ff8b;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.box{max-width:520px}
h1{font-size:clamp(64px,18vw,120px);font-weight:800;letter-spacing:.14em;line-height:.9;text-shadow:0 0 50px rgba(57,255,139,.45)}
p{color:#6c9c82;letter-spacing:.24em;text-transform:uppercase;font-size:11.5px;margin:18px 0 30px}
a{display:inline-block;color:#39ff8b;border:1px solid #0c3a23;padding:13px 24px;border-radius:5px;text-decoration:none;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;transition:.25s}
a:hover{background:#39ff8b;color:#03150c;box-shadow:0 0 30px rgba(57,255,139,.4)}
.grid{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(12,58,35,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(12,58,35,.5) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 75%)}
</style>
</head>
<body>
<div class="grid"></div>
<div class="box">
  <h1>404</h1>
  <p>this page is not the meat</p>
  <a href="/">go back to the machine</a>
</div>
</body>
</html>
